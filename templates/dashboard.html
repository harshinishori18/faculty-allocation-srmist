<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — SRMIST Faculty Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"/>
</head>
<body>

  <header>
    <div class="header-left">
      <p class="eyebrow">SRM Institute of Science and Technology</p>
      <h1>Faculty Allocation System</h1>
    </div>
    <div class="header-right">
      <span style="color:var(--gold); font-size:13px; font-weight:500;">
        {{ faculty_name }}
      </span>
      &nbsp;&nbsp;
      <a href="/" style="color:rgba(244,241,222,0.5);
         text-decoration:none; font-size:11px; letter-spacing:2px;
         text-transform:uppercase;">← Back</a>
    </div>
  </header>

  <div class="dashboard-container">

    <!-- Workload card -->
    <div class="dash-card">
      <p class="overline">Individual View</p>
      <h3>Your Workload</h3>
      <div id="workload_result" class="result-box"></div>
      <p id="workload_msg" class="msg"></p>
    </div>

    <!-- Schedule card -->
    <div class="dash-card wide">
      <p class="overline">Your Timetable</p>
      <h3>Assigned Schedule</h3>
      <div id="schedule_table" style="margin-top:20px;">
        <p style="color:rgba(244,241,222,0.4); font-size:14px;">Loading schedule...</p>
      </div>
    </div>

  </div>

  <script>
    const FACULTY_NAME = "{{ faculty_name }}";

    async function loadWorkload() {
      if (!FACULTY_NAME) return;
      const res  = await fetch('/schedule/workload/' + encodeURIComponent(FACULTY_NAME));
      const data = await res.json();
      const box  = document.getElementById('workload_result');
      const msg  = document.getElementById('workload_msg');

      if (!res.ok) {
        msg.textContent = 'No schedule data found for ' + FACULTY_NAME + '.';
        msg.className = 'msg error';
        box.style.display = 'none';
        return;
      }

      box.style.display = 'block';
      box.innerHTML = `
        <div class="stat-row">
          <div class="stat"><span class="stat-num">${data.total_classes}</span><span class="stat-label">Total Classes</span></div>
          <div class="stat"><span class="stat-num">${data.consecutive_classes}</span><span class="stat-label">Consecutive</span></div>
          <div class="stat"><span class="stat-num">${data.idle_gaps}</span><span class="stat-label">Idle Gaps</span></div>
          <div class="stat"><span class="stat-num">${data.workload_score}</span><span class="stat-label">Score</span></div>
        </div>
        <table class="sched-table">
          <tr><th>Day</th><th>Classes</th></tr>
          ${Object.entries(data.daily_classes).map(([d,c]) =>
            `<tr><td>${d}</td><td>${c}</td></tr>`).join('')}
        </table>`;
    }

    async function loadSchedule() {
      const res  = await fetch('/schedule/generate');
      const data = await res.json();

      // Filter to only show logged-in faculty's classes
      const myClasses = data.schedule.filter(e =>
        e.faculty_name.toLowerCase() === FACULTY_NAME.toLowerCase()
      );

      if (myClasses.length === 0) {
        document.getElementById('schedule_table').innerHTML =
          '<p style="color:rgba(244,241,222,0.4); font-size:14px;">No classes assigned yet.</p>';
        return;
      }

      const rows = myClasses.map(e =>
        `<tr>
          <td>${e.day}</td>
          <td>${e.subject}</td>
          <td>${e.start_time}–${e.end_time}</td>
          <td>Block ${e.block}</td>
        </tr>`
      ).join('');

      document.getElementById('schedule_table').innerHTML = `
        <table class="sched-table">
          <tr><th>Day</th><th>Subject</th><th>Time</th><th>Block</th></tr>
          ${rows}
        </table>`;
    }

    // Auto-load both on page open
    window.onload = () => {
      loadWorkload();
      loadSchedule();
    };
  </script>
</body>
</html>
