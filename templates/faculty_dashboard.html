<!DOCTYPE html>
<html>

<head>

<title>Faculty Dashboard</title>

</head>

<body>

<h1>

Welcome {{ faculty.username }}

</h1>

<p>

Faculty ID :
{{ faculty.faculty_id }}

</p>

<p>

Current Workload :
<b>{{ workload }}</b> Hours

</p>

<h3>

Subjects

</h3>

<ul>

{% for subject in subjects %}

<li>{{ subject }}</li>

{% endfor %}

</ul>

<br>

<button onclick="window.location.href='/timetable'">

View Timetable

</button>

<br><br>

<button onclick="window.location.href='/logout'">

Logout

</button>

</body>

</html>
