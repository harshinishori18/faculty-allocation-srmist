{% extends "base.html" %}

{% block title %}Admin Login — SRMIST{% endblock %}

{% block content %}
<main>
  <div class="card">
    <p class="overline">Administrative</p>
    <h2>Admin<br>Portal</h2>
    <div class="divider"></div>
    <p class="subtitle">Admin credentials required.</p>

    <form method="POST" style="text-align: left;">
      <div class="form-group">
        <label>Faculty ID</label>
        <input type="text" name="faculty_id" placeholder="e.g. admin" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required/>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn-primary">Sign In</button>
        <a href="/" style="text-decoration: none;">
          <button type="button" class="btn-secondary" style="width: 100%;">Back</button>
        </a>
      </div>
    </form>

    {% if error %}
    <p class="msg error">{{ error }}</p>
    {% endif %}
  </div>
</main>
{% endblock %}
